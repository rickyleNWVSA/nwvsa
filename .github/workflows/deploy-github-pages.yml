name: Deploy dev preview to GitHub Pages

# Builds the frontend and publishes it to the separate rickyleNWVSA.github.io
# repo, which GitHub serves at https://rickyleNWVSA.github.io/ with no
# subpath. This is a dev/preview mirror only — production lives on
# northwestvsa.com (IntraServer), deployed separately by uploading
# frontend/dist/ there by hand. See README.md for both.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: SPA fallback for direct/deep links
        # GitHub Pages has no server-side rewrite (unlike the .htaccess used
        # on the real northwestvsa.com host), so a request to e.g. /donations
        # 404s instead of reaching index.html. GitHub Pages serves 404.html
        # for any unmatched path, so making it an exact copy of index.html
        # lets the app boot and React Router take it from there. This only
        # works because this site is served at the repo root with no
        # subpath — a project-pages subpath would need the fuller
        # sessionStorage-redirect version of this trick.
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Deploy to rickyleNWVSA.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: rickyleNWVSA/rickyleNWVSA.github.io
          publish_branch: main
          publish_dir: frontend/dist
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy ${{ github.sha }}"
